# Nginx config — reverse proxy for VNAC ML Inference Server
# Hardened for 1GB RAM VPS

limit_req_zone $binary_remote_addr zone=acml_global:10m rate=1000r/m;

server {
    listen 80;
    server_name ml.ac.yourdomain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ml.ac.yourdomain.com;

    # SSL — Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/ml.ac.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ml.ac.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # Rate limiting
    limit_req zone=acml_global burst=200 nodelay;

    # Request size limits
    client_body_buffer_size 2k;
    client_body_timeout 2s;
    client_max_body_size 10k;
    client_header_timeout 5s;

    # Proxy to uvicorn
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3s;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_buffering off;
    }

    # Health check — restricted
    location /v1/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # Metrics — restricted
    location /v1/metrics {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    access_log /var/log/nginx/acml-access.log json;
    error_log /var/log/nginx/acml-error.log warn;
}
