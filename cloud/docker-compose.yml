version: "3.8"

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ML_HOST=0.0.0.0
      - ML_PORT=8080
      - ML_WORKERS=1
      - ML_MAX_CONCURRENCY=16
      - ML_DATA_DIR=/data
      - ML_DB_PATH=/data/vnac.db
      - ML_ADMIN_KEY=${ML_ADMIN_KEY:?err}
      - ML_LOG_LEVEL=INFO
      - ML_MODEL_TTL=300
    volumes:
      - acml_data:/data
      - ./models:/data/models:ro
    deploy:
      resources:
        limits:
          memory: 900M
          cpus: "0.8"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    stop_grace_period: 10s

  # Optional: nginx reverse proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  acml_data:
